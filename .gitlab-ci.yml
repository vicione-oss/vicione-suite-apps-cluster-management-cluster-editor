### Scripts ###
.prepare_keys: &prepare_keys
  - apt update -y
  - "which ssh-agent || ( apt install -y openssh-client )"
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

.prepare_npm: &prepare_npm
  - cd src/ViciOne.Ui.ClusterEditor
  - npm install
  - npm run-script build
  - cd -

.patch_version: &patch_version
  - sed -i -E "s/##VERSION_REF##/$Version/g" src/ViciOne.Ui.ClusterEditor/wwwroot/data/version.json

.appsettings_credentials: &appsettings_credentials
  - patch_appsettings() { local file="${1}"; local pattern="${2}"; local replace=$(printf '%s\n' "${3}" | sed -e 's/[&|]/\\&/g'); sed -i -E "s|${pattern}|${replace}|g" "${file}"; }
  - patch_appsettings "./samples/Server/appsettings.json" "##NuGet_User_RO_JFrog##" "${NuGet_User_RO_JFrog}"
  - patch_appsettings "./samples/Server/appsettings.json" "##NuGet_PW_RO_JFrog##" "${NuGet_PW_RO_JFrog}"

.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogDevExpressProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

.update_nuget_source_rw: &update_nuget_source_rw
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_RW_JFrog -p $NuGet_PW_RW_JFrog --store-password-in-clear-text

.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules: &rules
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_manual: &rules_manual
  - <<: *rule_tag
    when: manual
    allow_failure: true
  - <<: *rule_default_branch
    when: manual
    allow_failure: true
  - <<: *rule_mr
    when: manual
    allow_failure: true
  - <<: *rule_web
    when: manual
    allow_failure: true

### Defaults ###
variables:
  IMAGE_NAME: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest
  RUNNER_TAG: saas-linux-small-amd64

stages:
  - build
  - test
  - pack
  - publish
  - deploy

Version:
  stage: .pre
  script:
    - if [[ -f "VERSION" ]]; then VERSION=$(head -n 1 VERSION); fi
    - if [[ ! -z "${CI_COMMIT_TAG}" ]]; then VERSION=$(echo $CI_COMMIT_TAG | sed 's/v//g'); fi
    - if [[ -z "${VERSION}" ]]; then VERSION='0.1.0'; fi
    - if [[ -z "${CI_COMMIT_TAG}" ]]; then VERSION="${VERSION}-ci${CI_PIPELINE_ID}"; fi
    - 'echo "Version=${VERSION}" >> version.env'
    - 'echo "PackageVersion=${VERSION}" >> version.env'
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
  rules: *rules

### CI Components ###
include:
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@2.2
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
  ### Test & Build
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@2.2
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - *prepare_npm
        - echo "$Version"
      tags:
        - ${RUNNER_TAG}
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@2.2
    inputs:
      coverage: true
      image: ${IMAGE_NAME}
      filter: '/[(Category!=Manual)&(Category!=Playwright)]'
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - *prepare_npm
      tags:
        - ${RUNNER_TAG}
  ### NuGet Packages
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-pack@2.2
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      project: 'src/ViciOne.Ui.ClusterEditor/ViciOne.Ui.ClusterEditor.csproj'
      before_script:
        - *activate_mise
        - *patch_version
        - 'echo "PackageVersion: ${PackageVersion:-notAssigned}"'
      tags:
        - ${RUNNER_TAG}
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-nuget-push@2.2
    inputs:
      image: ${IMAGE_NAME}
      source: "JFrogViciOne"
      filename_pattern: "./src/*"
      rules: *rules_manual
      before_script:
        - *activate_mise
        - *patch_version
        - *update_nuget_source_rw
      tags:
        - ${RUNNER_TAG}

Publish arm64:
  stage: build
  image: ${IMAGE_NAME}
  variables:
    PROJECT: './samples/Server/Server.csproj'
    DIRECTORY: 'artifacts/publish'
  before_script:
    - *activate_mise
    - *patch_version
    - *update_nuget_source_ro
    - *prepare_npm
    - echo "$Version"
  script:
    - *appsettings_credentials
    - mkdir -p "${DIRECTORY}"
    - ABSOLUTE_DIRECTORY=$(realpath "${DIRECTORY}")
    - dotnet restore
    - dotnet publish -c Release -r linux-arm64 -o "${ABSOLUTE_DIRECTORY}" -v m --self-contained true "${PROJECT}"
  artifacts:
    paths:
      - "artifacts/publish"
  rules: *rules_manual
  tags:
    - saas-linux-large-arm64

Deploy EC10:
  stage: deploy
  image: ${IMAGE_NAME}
  variables:
    DIRECTORY: 'artifacts/publish'
    HOST_IP: '10.45.24.161'
    INSTALL_DIRECTORY: '/opt/dfe'
    BINARY: "Server"
    LOGFILE: '/var/log/vo-cluster-editor.log'
  before_script:
    - apt update -y && apt install -y rsync bash
    - *prepare_keys
    - ssh-keyscan -T 250 $HOST_IP >> ~/.ssh/known_hosts
    - *patch_version
  script:
    - mkdir -p "${DIRECTORY}"
    - ABSOLUTE_DIRECTORY=$(realpath "${DIRECTORY}")
    - ssh -q  -o "ConnectTimeout=10" ${PUBLISH_USER}@${HOST_IP} "sudo pkill -9 -f ${BINARY}" || true
    - ssh -q  -o "ConnectTimeout=10" ${PUBLISH_USER}@${HOST_IP} "sudo mkdir -p ${INSTALL_DIRECTORY} && sudo chown -R ${PUBLISH_USER}:${PUBLISH_USER} ${INSTALL_DIRECTORY}"
    - ssh -q  -o "ConnectTimeout=10" ${PUBLISH_USER}@${HOST_IP} "sudo touch ${LOGFILE} && sudo chown ${PUBLISH_USER}:${PUBLISH_USER} ${LOGFILE}"
    - rsync -e 'ssh -q  -o "ConnectTimeout=10"' -rz --inplace --stats --delete "${ABSOLUTE_DIRECTORY}"/ ${PUBLISH_USER}@${HOST_IP}:${INSTALL_DIRECTORY}
    - ssh -q  -o "ConnectTimeout=10" ${PUBLISH_USER}@${HOST_IP} "sudo setcap 'cap_net_bind_service=+ep' ${INSTALL_DIRECTORY}/${BINARY}"
    - ssh -q  -o "ConnectTimeout=10" ${PUBLISH_USER}@${HOST_IP} "echo \"cd ${INSTALL_DIRECTORY} ;  nohup ./${BINARY} --urls http://0.0.0.0:80 &> ${LOGFILE} &\" > ${INSTALL_DIRECTORY}/run.sh"
    - ssh -q  -o "ConnectTimeout=10" ${PUBLISH_USER}@${HOST_IP} "chmod +x ${INSTALL_DIRECTORY}/run.sh ; ${INSTALL_DIRECTORY}/run.sh"
  rules:
    - if : '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  needs:
    - 'Publish arm64'
  environment:
    name: 'Demo EC10-1'
    url: http://$HOST_IP
  tags:
    - tdl
