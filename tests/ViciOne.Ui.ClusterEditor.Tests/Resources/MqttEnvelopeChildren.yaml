Common:
  Target       : DataPort                                                                          # required: Id String to identify the target of the file
  ContentType  : Rules                                                                             # required: Id String to identify the content of the file
  Version      : 2.0.0                                                                            # required: Version of the file
  Date         : 2026-09-02                                                                        # required: Date of the file
  Description  : "MQTT DataPort"                                                                   # required: Description of the file
  Author       : "ViciOne open automation gmbh"                                                               # required: Author of the file
  MetadataType : YAML                                                                              # required: Metadata type of the file (YAML, JSON, XML, Text, Binary, ...)
  Namespace    : "ViciOne.DataPort.Mqtt"                                                           # required: Namespace of the DataPort

Root:
  Id                       : "MQTTDataPort"                                                        # required: Id String to identify the root of the DataPort
  Name                     : "MQTT"                                                                # required: display name of the DataPort
  Description              : "DataPort for MQTT Protocol 3.x to 5.0"                               # required: display description of the DataPort
  Icon                     : mqtt                                                                  # required: just one Icon for the DataPort
  ChildNodes               :
    - Id                   : MQTT-Broker
      MaxDepth             : 64
      MaxInstances         : 8

Nodes:

  # -------------------- MQTT-Broker ------------------------------------

  - Id                     : MQTT-Broker
    Type                   : DataPortNode
    Name                   : "Broker"
    Description            : "Broker"
    MetadataLength         : 0
    Icon                   : broker
    TransferDirections     : [ Outbound, Inbound ]
    ChildNodes             :
      - Id                 : Folder
      - Id                 : DataPointBool
      - Id                 : DataPointInteger
      - Id                 : DataPointFloat
      - Id                 : DataPointDateTime
      - Id                 : DataPointString
      - Id                 : DataPointBinary
    PropertyCategories     :
      - Id                 : Connection
        Properties         :
          - Id             : Protocol
            Required       : true
          - Id             : Host
          - Id             : Port
          - Id             : Url
          - Id             : ClientId
          - Id             : ProtocolVersion
            Required       : true
          - Id             : Pooling
          - Id             : Username
          - Id             : Password
      - Id                 : Session
        Properties         :
          - Id             : CleanSession
          - Id             : SessionExpiryInterval
          - Id             : MaxPendingMessages
          - Id             : BrokerReceiveMaximum
      - Id                 : LastWill
        Properties         :
          - Id             : WillTopic
          - Id             : WillMessage
          - Id             : WillRetain
      - Id                 : Certificate
        Properties         :
          - Id             : SslProtocol
          - Id             : CertificateFile
          - Id             : CertificateFilePassword
          - Id             : CertificatePrivateKeyFile
          - Id             : CertificateAuthorityFile
          - Id             : DisableCertificateValidation
      - Id                 : Other
        Properties         :
          - Id             : QualityOfService
            Required       : true
          - Id             : DefaultSerializer

  # -------------------- Folder ------------------------------------------

  - Id                     : Folder
    MappingId              : Topic
    Type                   : DataPortTreeNode
    Name                   : "Folder"
    Description            : "Folder in the MQTT Topic Tree"
    Icon                   : folder
    TransferModes          : [ None, OnChange, Periodic  ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f#+]+$'
        Message            : "MQTT topic may not contain control characters, '#' or '+'."
    ChildNodes             :
      - Id                 : Folder
      - Id                 : DataPointBool
      - Id                 : DataPointInteger
      - Id                 : DataPointFloat
      - Id                 : DataPointDateTime
      - Id                 : DataPointString
      - Id                 : DataPointBinary

  # -------------------- DataPoints --------------------------------------

  - Id                     : DataPointBool
    MappingId              : Topic
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Bool"
    Description            : "Boolean data point in the MQTT topic tree"
    Icon                   : datapoint
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f#+]+$'
        Message            : "MQTT topic may not contain control characters, '#' or '+'."
    ChildNodes             :
      - Id                 : UserProperty
        MaxInstances       : 16
      - Id                 : Timestamp
        MaxInstances       : 1
      - Id                 : EngineCycle
        MaxInstances       : 1
      - Id                 : Validity
        MaxInstances       : 1
      - Id                 : Type
        MaxInstances       : 1
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : Retain
          - Id             : Serializer

  - Id                     : DataPointInteger
    MappingId              : Topic
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Integer"
    Description            : "Integer data point in the MQTT topic tree"
    Icon                   : datapoint
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Int32, Int64, Int16, Int8, UInt32, UInt64, UInt16, UInt8 ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f#+]+$'
        Message            : "MQTT topic may not contain control characters, '#' or '+'."
    ChildNodes             :
      - Id                 : UserProperty
        MaxInstances       : 16
      - Id                 : Timestamp
        MaxInstances       : 1
      - Id                 : EngineCycle
        MaxInstances       : 1
      - Id                 : Validity
        MaxInstances       : 1
      - Id                 : Type
        MaxInstances       : 1
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : Retain
          - Id             : Serializer

  - Id                     : DataPointFloat
    MappingId              : Topic
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Float"
    Description            : "Float data point in the MQTT topic tree"
    Icon                   : datapoint
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Float64, Float32 ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f#+]+$'
        Message            : "MQTT topic may not contain control characters, '#' or '+'."
    ChildNodes             :
      - Id                 : UserProperty
        MaxInstances       : 16
      - Id                 : Timestamp
        MaxInstances       : 1
      - Id                 : EngineCycle
        MaxInstances       : 1
      - Id                 : Validity
        MaxInstances       : 1
      - Id                 : Type
        MaxInstances       : 1
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : Retain
          - Id             : Serializer

  - Id                     : DataPointDateTime
    MappingId              : Topic
    Type                   : DataPortTreeNode
    Name                   : "DataPoint DateTime"
    Description            : "DateTime data point in the MQTT topic tree"
    Icon                   : datapoint
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ DateTime ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f#+]+$'
        Message            : "MQTT topic may not contain control characters, '#' or '+'."
    ChildNodes             :
      - Id                 : UserProperty
        MaxInstances       : 16
      - Id                 : Timestamp
        MaxInstances       : 1
      - Id                 : EngineCycle
        MaxInstances       : 1
      - Id                 : Validity
        MaxInstances       : 1
      - Id                 : Type
        MaxInstances       : 1
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : Retain
          - Id             : Serializer

  - Id                     : DataPointString
    MappingId              : Topic
    Type                   : DataPortTreeNode
    Name                   : "DataPoint String"
    Description            : "String data point in the MQTT topic tree"
    Icon                   : datapoint
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ String ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f#+]+$'
        Message            : "MQTT topic may not contain control characters, '#' or '+'."
    ChildNodes             :
      - Id                 : UserProperty
        MaxInstances       : 16
      - Id                 : Timestamp
        MaxInstances       : 1
      - Id                 : EngineCycle
        MaxInstances       : 1
      - Id                 : Validity
        MaxInstances       : 1
      - Id                 : Type
        MaxInstances       : 1
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : Retain
          - Id             : Serializer

  - Id                     : DataPointBinary
    MappingId              : Topic
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Binary"
    Description            : "Binary data point in the MQTT topic tree"
    Icon                   : datapoint
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Binary ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f#+]+$'
        Message            : "MQTT topic may not contain control characters, '#' or '+'."
    ChildNodes             :
      - Id                 : UserProperty
        MaxInstances       : 16
      - Id                 : Timestamp
        MaxInstances       : 1
      - Id                 : EngineCycle
        MaxInstances       : 1
      - Id                 : Validity
        MaxInstances       : 1
      - Id                 : Type
        MaxInstances       : 1
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : Retain
          - Id             : Serializer

  # -------------------- Envelope children -------------------------------

  - Id                     : UserProperty
    MappingId              : UserProperty
    Type                   : DataPortTreeNode
    Name                   : "User property"
    Description            : "A user property of the message of its parent data point. The node name is the key it is sent under, and the keys 'Timestamp', 'Validity', 'EngineCycle' and 'Type' are reserved. This data port puts at most 16 user properties on a message. It has no topic and no transfer of its own; its value is carried by the parent message."
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ String, Int64, Float64, Bool, DateTime ]
    NameValidations        :
      - Type               : Regex
        Pattern            : '^[^\x00-\x1f\x7f]+$'
        Message            : "A user property key may not be empty and may not contain control characters."

  - Id                     : Timestamp
    MappingId              : Timestamp
    Type                   : DataPortTreeNode
    Name                   : "Timestamp"
    Description            : "Carries the timestamp of the parent value as the 'Timestamp' user property of the parent message. Leave it unlinked to send the timestamp of the parent value, or link it to send a timestamp of your own instead; inbound it publishes the received timestamp. It has no transfer of its own; its value is carried by the parent message."
    Icon                   : datapoint
    TransferModes          : [ None ]
    DataTypes              : [ DateTime ]

  - Id                     : EngineCycle
    MappingId              : EngineCycle
    Type                   : DataPortTreeNode
    Name                   : "EngineCycle"
    Description            : "Carries the engine cycle the message was published in as the 'EngineCycle' user property of the parent message, outbound only. It cannot be linked: the port fills it from the running engine cycle. It has no transfer of its own; its value is carried by the parent message."
    Icon                   : datapoint
    TransferModes          : [ None ]
    TransferDirections     : [ Outbound ]
    LinkDirections         : [ None ]
    DataTypes              : [ Int64 ]

  - Id                     : Validity
    MappingId              : Validity
    Type                   : DataPortTreeNode
    Name                   : "Validity"
    Description            : "Carries the validity of the parent value as the 'Validity' user property of the parent message, outbound only. It cannot be linked: the port derives it from the parent value. It has no transfer of its own; its value is carried by the parent message."
    Icon                   : datapoint
    TransferModes          : [ None ]
    TransferDirections     : [ Outbound ]
    LinkDirections         : [ None ]
    DataTypes              : [ Bool ]

  - Id                     : Type
    MappingId              : Type
    Type                   : DataPortTreeNode
    Name                   : "Type"
    Description            : "Adds the .NET type name of the published value as the 'Type' user property of the parent message, outbound only, so a receiving ViciOne system deserializes it with the sender's type. It cannot be linked: the port writes the assembly-qualified name of the parent value's runtime type. It has no transfer of its own; its value is carried by the parent message."
    Icon                   : datapoint
    TransferModes          : [ None ]
    TransferDirections     : [ Outbound ]
    LinkDirections         : [ None ]
    DataTypes              : [ String ]

PropertyCategories:
  - Id          : Connection
    Name        : "Connection"
    Description : "Connection properties"

  - Id          : Session
    Name        : "Session"
    Description : "Session properties"

  - Id          : Certificate
    Name        : "Certificate"
    Description : "Certificate properties"

  - Id          :  LastWill
    Name        : "Last Will"
    Description : "Last Will properties"

  - Id          : Other
    Name        : "Other"
    Description : "Other properties"

Properties:
  - Id          : ClientId
    Name        : "Client ID"
    Description : "The identifier this client registers with at the broker. Left empty the broker assigns one, which no session can be resumed with."
    DataType    : String
    UiControl   : TextBox

  - Id          : WillTopic
    Name        : "Will topic"
    Description : "The topic the will message is published to when the connection is lost. The will is only sent when a message is configured as well."
    DataType    : String
    UiControl   : TextBox
    Validations :
      - Type    : Regex
        Pattern : '^[^\x00-\x1f\x7f#+]+$'
        Message : "MQTT topic may not contain control characters, '#' or '+'."

  - Id          : WillMessage
    Name        : "Will message"
    Description : "The message published to the will topic when the connection is lost."
    DataType    : String
    UiControl   : TextBox

  - Id          : WillRetain
    Name        : "Will retain"
    Description : "Keep the will message on the broker, so it reaches clients subscribing after the connection was lost."
    DataType    : Bool
    DefaultValue: false
    UiControl   : CheckBox

  - Id                 : Protocol
    Name               : "Protocol"
    Description        : "The protocol used to contact the broker"
    DataType           : UInt8
    DefaultValue       : 0
    UiControl          : NumericListBox
    MinValue           : 0
    MaxValue           : 1
    Elements           : { 0: 'TCP',
                           1: 'WebSocket' }
    DependentProperties: { 'Host'       : [0],
                           'Port'       : [0],
                           'Url'        : [1],
                           'SslProtocol': [0] }

  - Id          : Host
    Name        : "Host"
    Description : "The broker host name or IP address for TCP, without a scheme and without the port. Required for the TCP protocol."
    DataType    : String
    UiControl   : TextBox
    Validations :
      - Type    : Regex
        Pattern : '^[^\s/]+$'
        Message : "The broker host is a host name or an IP address, without a scheme and without the port."

  - Id          : Port
    Name        : "Port"
    Description : "The broker port for TCP. Plain MQTT usually listens on 1883, MQTT over TLS on 8883."
    DataType    : UInt16
    UiControl   : NumericUpDown
    MinValue    : 1
    DefaultValue: 1883

  - Id          : Url
    Name        : "Url"
    Description : "The broker url for WebSocket. Only 'ws' and 'wss' are supported, of which 'wss' is encrypted. Required for the WebSocket protocol."
    DataType    : Uri
    UiControl   : TextBox
    Validations :
      - Type    : Regex
        Pattern : '^\s*[wW][sS][sS]?://\S'
        Message : "The broker url has to use the 'ws' or the 'wss' scheme."

  - Id          : QualityOfService
    Name        : "Quality of service"
    Description : "The delivery guarantee used for published messages and for the will message."
    DataType    : UInt8
    DefaultValue: 0
    UiControl   : NumericListBox
    MinValue    : 0
    MaxValue    : 2
    Elements    : { 0: 'At most once',
                    1: 'At least once',
                    2: 'Exactly once' }

  - Id                 : ProtocolVersion
    Name               : "Protocol version"
    Description        : "The version of the MQTT protocol spoken with the broker. Settings that MQTT 3.1.1 does not know are only offered for v5.0."
    DataType           : UInt8
    DefaultValue       : 1
    UiControl          : NumericListBox
    MinValue           : 0
    MaxValue           : 1
    Elements           : { 0: 'v3.1.1',
                           1: 'v5.0' }
    DependentProperties: { 'SessionExpiryInterval': [1] }

  - Id          : Username
    Name        : "User name"
    Description : "The user name the broker authenticates. MQTT transmits it in clear text, so it is only protected by an encrypted connection."
    DataType    : String
    UiControl   : TextBox

  - Id          : Password
    Name        : "Password"
    Description : "The password the broker authenticates. MQTT transmits it in clear text, so it is only protected by an encrypted connection."
    DataType    : String
    UiControl   : PasswordBox

  - Id          : CertificateFile
    Name        : "Certificate file"
    Description : "The client certificate presented to the broker, as PKCS#12 or PEM. Accepts a file path, the content itself or the content Base64 encoded. It has to carry its private key, and configuring it encrypts the connection."
    DataType    : String
    UiControl   : TextBox

  - Id          : CertificateFilePassword
    Name        : "Certificate file password"
    Description : "The password of a PKCS#12 certificate file. It cannot be used with a PEM certificate, whose private key has to be unencrypted."
    DataType    : String
    UiControl   : PasswordBox

  - Id          : CertificatePrivateKeyFile
    Name        : "Certificate private key file"
    Description : "The PEM encoded private key of a PEM certificate, where it is required. It has to stay empty for a PKCS#12 certificate, which carries its key already."
    DataType    : String
    UiControl   : TextBox

  - Id          : CertificateAuthorityFile
    Name        : "Certificate authority file"
    Description : "The certificate authority the broker certificate is validated against, for a broker of a private PKI. Holds PEM, a single certificate or a bundle, or one DER encoded certificate. A self-signed broker certificate configured here anchors on itself, which trusts that one broker and nothing else. Without it the broker is validated against the trusted authorities of the system."
    DataType    : String
    UiControl   : TextBox

  - Id          : SslProtocol
    Name        : "SSL protocol"
    Description : "The TLS version enforced for a TCP connection. 'None' does not mean the version of the system, it means that this setting does not encrypt the connection; once a certificate encrypts it, leaving 'None' negotiates TLS 1.2 or 1.3."
    DataType    : UInt8
    DefaultValue: 0
    UiControl   : NumericListBox
    MinValue    : 0
    MaxValue    : 2
    Elements    : { 0: 'None',
                    1: 'TLSv1.2',
                    2: 'TLSv1.3' }

  - Id                 : DisableCertificateValidation
    Name               : "Disable certificate validation"
    Description        : "Accept any broker certificate. It contradicts the certificate authority file, which validates the broker."
    DataType           : Bool
    DefaultValue       : false
    UiControl          : CheckBox
    DependentProperties: { 'CertificateAuthorityFile': [false] }

  - Id          : CleanSession
    Name        : "Clean session"
    Description : "Start with a fresh session instead of resuming the one the broker kept for this client id."
    DataType    : Bool
    DefaultValue: true
    UiControl   : CheckBox

  - Id          : SessionExpiryInterval
    Name        : "Session expiry interval"
    Description : "The seconds the broker keeps the session after the connection is lost. Known to MQTT 5.0 only; 0 discards the session immediately."
    DataType    : UInt32
    DefaultValue: 0
    UiControl   : NumericUpDown
    MinValue    : 0

  - Id          : Retain
    Name        : "Retain"
    Description : "Keep the last message of this topic on the broker, so it reaches clients subscribing later."
    DataType    : Bool
    DefaultValue: false
    UiControl   : CheckBox

  - Id          : DefaultSerializer
    Name        : "Serializer"
    Description : "The payload format used by the data points of this broker that do not choose one themselves."
    DataType    : UInt8
    UiControl   : NumericListBox
    MinValue    : 1
    MaxValue    : 1
    DefaultValue: 1
    Elements    : { 1: 'JSON', }

  - Id          : Serializer
    Name        : "Serializer"
    Description : "The payload format of this data point. 'Inherited' uses the serializer configured at the broker."
    DataType    : UInt8
    UiControl   : NumericListBox
    MinValue    : 0
    MaxValue    : 2
    DefaultValue: 0
    Elements    : { 0: 'Inherited',
                    1: 'JSON',
                    2: 'PlainText', }

  - Id          : Pooling
    Name        : "Pooling"
    Description : "Pooling is a technique that involves creating and maintaining a pool of connections, which are then be reused"
    DataType    : Bool
    DefaultValue: true
    UiControl   : CheckBox

  - Id          : MaxPendingMessages
    Name        : "MaxPendingMessages"
    Description : "The messages queued while the connection is down. The oldest is dropped once the queue is full."
    DataType    : Int32
    DefaultValue: 100000
    UiControl   : NumericUpDown
    MinValue    : 1

  - Id          : BrokerReceiveMaximum
    Name        : "BrokerReceiveMaximum"
    Description : "The messages published without waiting for their acknowledgement. An MQTT 5.0 broker may lower it further."
    DataType    : UInt16
    DefaultValue: 100
    UiControl   : NumericUpDown
    MaxValue    : 100
    MinValue    : 1

Icons:

  - Id          : mqtt
    Content     : 
    ContentType : Base64
